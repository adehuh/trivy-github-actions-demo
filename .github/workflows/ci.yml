# GitHub Actions only (no GitLab). Same 21 jobs / needs / triggers as the PDF
# "GitLab CI vs GitHub Actions", but the security jobs run REAL Trivy scans:
#   secret_detection   -> trivy fs --scanners secret
#   snyk_dependencies  -> trivy fs --scanners vuln      (SCA)
#   iac_security       -> trivy config .                (Dockerfile + K8s)
#   kubernetes_validation -> trivy config k8s/
#   license_compliance -> trivy fs --scanners license
#   build_image        -> real docker build, push to GHCR on main (real sha256 digest)
#   snyk_container     -> trivy image                   (OS + language packages)
#   sbom               -> trivy image --format cyclonedx
#   nightly_regression -> nightly Trivy rescan for newly published CVEs
#   cosign             -> keyless sign + verify of the GHCR digest (GitHub OIDC, Sigstore)
#   e2e_p0 / e2e_p1    -> Cypress (cypress/e2e/p0, p1) against the built image
#   dast_zap           -> OWASP ZAP baseline against the built image (.zap/rules.tsv)
#   production_smoke   -> curl checks on the promoted digest pulled from GHCR
# sonarqube, staging/production deploy and production_monitor need external systems
# (SonarQube, Argo CD, Prometheus): they keep the PDF echo lines + a commented real sample.
name: CI (Trivy)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC (= 09:00 WIB)
  workflow_dispatch:

permissions:
  contents: read 

# IMPORTANT: explicit `shell: bash` = `bash -eo pipefail`. Without it GitHub uses
# `bash -e` and `trivy ... | tee file` would return tee's exit code (0),
# so a failing Trivy gate would NOT fail the job.
defaults:
  run:
    shell: bash

# PRs: a new push cancels the older PR run. main: every run is independent, so
# a run waiting for production approval never blocks the next push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: v0.76.2
  # Gate policy: fail on HIGH/CRITICAL that already have a fix
  GATE_SEVERITY: HIGH,CRITICAL

jobs:
  # ───────────────────────── 01-02 validate ─────────────────────────
  validate_config:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Validate config
        run: |
          echo "[VALIDATE] Check GitHub Actions YAML, Dockerfile, and configuration"
          pip install -q pyyaml
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]" && echo "workflow YAML OK"
          python3 -c "import yaml; list(yaml.safe_load_all(open('k8s/deployment.yaml')))" && echo "k8s YAML OK"
          test -f Dockerfile && echo "Dockerfile present"

  secret_detection:
    name: secret_detection (Trivy)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy secret scan (BLOCK on leaked credentials)
        run: |
          echo "[SECRET] Check passwords, API keys, JWT tokens, private keys"
          echo "[SECRET] BLOCK on confirmed leaked credentials"
          echo "[SECRET] >>> running: trivy fs --scanners secret"
          trivy fs --scanners secret --exit-code 1 --format table . | tee trivy-secret.txt
      - name: Job summary
        if: always()
        run: |
          { echo '### Trivy secret scan'; echo '```'; cat trivy-secret.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────── 03-04 test ─────────────────────────
  unit_test:
    needs: [validate_config, secret_detection]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Unit test
        run: |
          echo "[UNIT] P0 payment and stock calculation"
          echo "[UNIT] P1 discount rules; P2 edge cases"
          python -m unittest tests.test_unit -v
          echo "[UNIT] Generate coverage for SonarQube (simulation)"

  integration_test:
    needs: [validate_config, secret_detection]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Integration test (real HTTP server)
        run: |
          echo "[INTEGRATION] P0 auth, order/inventory, payment mock"
          echo "[INTEGRATION] P1 product and profile database flows"
          python -m unittest tests.test_integration -v

  # ───────────────────────── 05-09 analyze ─────────────────────────
  sonarqube:
    needs: [unit_test, integration_test]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Simulated sonarqube
        run: |
          echo "[SONAR] Analyze bugs, code smells, hotspots, coverage"
          echo "[SONAR] BLOCK if quality gate fails"
      # SAMPLE (needs a SonarQube server / SonarCloud + secret SONAR_TOKEN, so it stays commented):
      # - uses: actions/checkout@<sha>        # with: fetch-depth: 0 (full history for new-code detection)
      # - uses: SonarSource/sonarqube-scan-action@<sha>   # v6
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      #   with:
      #     args: >
      #       -Dsonar.projectKey=trivy-github-actions-demo
      #       -Dsonar.sources=app -Dsonar.tests=tests
      #       -Dsonar.python.coverage.reportPaths=coverage.xml
      #       -Dsonar.qualitygate.wait=true    # job FAILS when the Quality Gate is red

  snyk_dependencies:
    name: snyk_dependencies (Trivy SCA)
    needs: [unit_test, integration_test]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy dependency scan (BLOCK on policy-breaking CVEs)
        run: |
          echo "[SNYK SCA] Check dependencies, CVEs, OWASP vulnerable components"
          echo "[SNYK SCA] BLOCK on policy-breaking findings"
          echo "[SNYK SCA] >>> running: trivy fs --scanners vuln (Trivy replaces Snyk)"
          trivy fs --scanners vuln --severity "$GATE_SEVERITY" --ignore-unfixed \
            --exit-code 1 --format table . | tee trivy-deps.txt
      - name: Job summary
        if: always()
        run: |
          { echo '### Trivy dependency scan'; echo '```'; cat trivy-deps.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  iac_security:
    name: iac_security (Trivy config)
    needs: [unit_test, integration_test]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      # Terraform is NOT executed here: no `terraform init/plan/apply` and no AWS
      # credentials. Trivy only reads the *.tf files statically (e.g. it checks
      # security-group cidr_blocks for 0.0.0.0/0 or ::/0).
      # examples/terraform/fail is intentionally insecure, so it is skipped by the
      # gate and checked by the "policy self-test" step below instead.
      - name: Trivy misconfiguration scan (Dockerfile, Kubernetes, Terraform)
        run: |
          echo "[IAC] Checkov/Trivy config checks for Terraform and Kubernetes"
          echo "[IAC] Terraform is scanned statically only (not applied - no cloud credentials)"
          echo "[IAC] >>> running: trivy config . (skip examples/terraform/fail)"
          trivy config --severity "$GATE_SEVERITY" --exit-code 1 --format table \
            --skip-dirs examples/terraform/fail . | tee trivy-iac.txt
      - name: Policy self-test (insecure Terraform MUST be blocked)
        run: |
          echo "[IAC] >>> running: trivy config examples/terraform/fail (expect exit 1)"
          if trivy config --severity "$GATE_SEVERITY" --exit-code 1 --format table examples/terraform/fail | tee trivy-iac-fail.txt; then
            echo "::error::Gate is broken: 0.0.0.0/0 security group was NOT blocked"
            exit 1
          fi
          echo "[IAC] OK: open CIDR (0.0.0.0/0, ::/0) was blocked by Trivy as expected"
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Trivy IaC scan (gate)'; echo '```'; cat trivy-iac.txt; echo '```'
            echo '### Policy self-test: examples/terraform/fail (expected to be blocked)'; echo '```'; cat trivy-iac-fail.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  kubernetes_validation:
    name: kubernetes_validation (Trivy)
    needs: [unit_test, integration_test]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy Kubernetes manifest policy check
        run: |
          echo "[K8S] kubeconform schema and Kyverno policy checks"
          echo "[K8S] >>> running: trivy config k8s/ (Trivy KSV policies)"
          # Full report (all severities) for visibility ...
          trivy config --format table k8s/ | tee trivy-k8s.txt
          # ... gate only on HIGH/CRITICAL
          trivy config --severity "$GATE_SEVERITY" --exit-code 1 --quiet k8s/
      - name: Job summary
        if: always()
        run: |
          { echo '### Trivy Kubernetes scan'; echo '```'; cat trivy-k8s.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  license_compliance:
    name: license_compliance (Trivy)
    needs: [unit_test, integration_test]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy license scan (BLOCK on forbidden/restricted licenses)
        run: |
          echo "[LICENSE] Check dependencies against license policy"
          echo "[LICENSE] >>> running: trivy fs --scanners license"
          trivy fs --scanners license --severity "$GATE_SEVERITY" --exit-code 1 --format table . | tee trivy-license.txt
      - name: Job summary
        if: always()
        run: |
          { echo '### Trivy license scan'; echo '```'; cat trivy-license.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────── 10 build ─────────────────────────
  build_image:
    needs: [sonarqube, snyk_dependencies, iac_security, kubernetes_validation, license_compliance]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io (only used on main)
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build one Docker image
        run: |
          echo "[BUILD] Compile application and build one Docker image"
          echo "[BUILD] >>> running: docker build"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "app:${GITHUB_SHA}" .
          # Same image bytes are handed to scan/SBOM jobs, so we scan exactly what we ship
          docker save -o image.tar "app:${GITHUB_SHA}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and resolve immutable digest
        id: ref
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PRs never push; downstream jobs use the image.tar artifact
            echo "image_ref=app:${GITHUB_SHA} (local, not pushed on PR)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "app:${GITHUB_SHA}" "${REPO}:${GITHUB_SHA}"
          docker tag "app:${GITHUB_SHA}" "${REPO}:main"
          # Retry: the very first push to a new GHCR package can be denied while
          # the package <-> repo link is being created
          push() { for i in 1 2 3; do docker push -q "$1" && return 0; echo "push retry $i"; sleep $((i*10)); done; return 1; }
          push "${REPO}:${GITHUB_SHA}"
          push "${REPO}:main"
          # Pick the digest that belongs to the GHCR repo (not the local "app" tag)
          REF=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${REPO}:${GITHUB_SHA}" | grep "^${REPO}@sha256:" | head -1)
          test -n "$REF"
          echo "[BUILD] Immutable reference: ${REF} (real registry digest)"
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "**Image:** \`${REF}\`" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────── 11-13 supply_chain ─────────────────────────
  snyk_container:
    name: snyk_container (Trivy image)
    needs: [build_image]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ needs.build_image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (for trivy.yaml)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy image scan (OS packages + base image CVEs)
        run: |
          echo "[CONTAINER] Scan image OS packages and base image CVEs - $IMAGE_REF"
          echo "[CONTAINER] >>> running: trivy image (Trivy replaces Snyk)"
          trivy image --input image.tar --format table | tee trivy-image.txt
          trivy image --input image.tar --severity "$GATE_SEVERITY" --ignore-unfixed --exit-code 1 --quiet
      - name: Job summary
        if: always()
        run: |
          { echo '### Trivy image scan'; echo "\`$IMAGE_REF\`"; echo '```'; cat trivy-image.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: sbom (Trivy CycloneDX)
    needs: [build_image]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Generate CycloneDX + SPDX bill of materials
        run: |
          echo "[SBOM] Generate CycloneDX/SPDX bill of materials"
          echo "[SBOM] >>> running: trivy image --format cyclonedx / spdx-json"
          trivy image --input image.tar --format cyclonedx --output sbom.cdx.json
          trivy image --input image.tar --format spdx-json  --output sbom.spdx.json
          echo "components: $(python3 -c "import json;print(len(json.load(open('sbom.cdx.json')).get('components',[])))")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.*.json

  # Keyless signing: no private key to store. GitHub OIDC token -> Sigstore Fulcio short-lived
  # certificate -> signature pushed next to the image in GHCR + entry in the Rekor transparency log.
  cosign:
    name: cosign (keyless sign + verify)
    needs: [build_image]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the signature to ghcr.io
      id-token: write # OIDC token for keyless signing
    env:
      IMAGE_REF: ${{ needs.build_image.outputs.image_ref }}
    steps:
      - name: Sign and attest
        run: echo "[SIGN] Sign and attest image - $IMAGE_REF"
      - name: Skip on pull requests (image is not pushed)
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "[SIGN] PR build - nothing pushed, nothing to sign"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ github.event_name != 'pull_request' }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: cosign sign + verify (by digest, never by tag)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "[SIGN] >>> running: cosign sign --yes $IMAGE_REF"
          cosign sign --yes "$IMAGE_REF"
          echo "[SIGN] >>> running: cosign verify (who signed it: this repo's workflow on GitHub)"
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > verify.json
          echo "[SIGN] verified: $(python3 -c "import json;print(len(json.load(open('verify.json'))))") signature(s)"
          # SAMPLE: attach the SBOM as a signed attestation (needs the sbom job's artifact here):
          # cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"
          # Cluster side: Kyverno / Sigstore policy-controller admits only images signed by this workflow.

  # ───────────────────────── 14 staging (push main only) ─────────────────────────
  staging_deploy:
    needs: [snyk_container, sbom, cosign, build_image]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_REF: ${{ needs.build_image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulated staging deploy
        run: |
          echo "[STAGING] Deploy EXACT image $IMAGE_REF via Argo CD (simulation)"
          # Render the manifest that would be committed to the GitOps repo
          sed "s|image: .*|image: ${IMAGE_REF}|" k8s/deployment.yaml | grep -n "image:"
      # SAMPLE GitOps deploy (needs a GitOps repo + Argo CD, so it stays commented):
      # - name: Bump image digest in the GitOps repo (Argo CD auto-syncs it)
      #   env: { GITOPS_TOKEN: "${{ secrets.GITOPS_TOKEN }}" }
      #   run: |
      #     git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/acme/demo-shop-gitops.git" gitops
      #     cd gitops
      #     yq -i ".image.digest = \"${IMAGE_REF#*@}\"" charts/api/values-staging.yaml
      #     git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -am "staging: ${GITHUB_SHA::7}"
      #     git push origin main
      #     argocd app wait api-staging --health --sync --timeout 300   # wait until Healthy

  # ───────────────────────── 15-17 e2e / dast ─────────────────────────
  # The demo has no real staging cluster, so each job starts the EXACT image built above
  # (image.tar artifact) on the runner and tests http://localhost:8080 as "staging".
  e2e_p0:
    name: e2e_p0 (Cypress)
    needs: [staging_deploy]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Start app (stand-in for staging)
        run: |
          docker load -i image.tar
          docker run -d --name app -p 8080:8080 "app:${GITHUB_SHA}"
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
      - name: Cypress P0 (blocking)
        run: |
          echo "[E2E P0] Login, cart, checkout, sandbox payment, inventory"
          echo "[E2E P0] Blocking critical flow tests"
          echo "[E2E P0] >>> running: cypress run --spec cypress/e2e/p0"
          docker run --rm --network host -v "$PWD:/e2e" -w /e2e \
            -e CYPRESS_baseUrl=http://localhost:8080 \
            cypress/included:16.2.0 --spec "cypress/e2e/p0/**/*.cy.js"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-p0-screenshots
          path: cypress/screenshots

  e2e_p1:
    name: e2e_p1 (Cypress, non-blocking)
    needs: [e2e_p0]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    continue-on-error: true # GitLab allow_failure: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Start app (stand-in for staging)
        run: |
          docker load -i image.tar
          docker run -d --name app -p 8080:8080 "app:${GITHUB_SHA}"
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
      - name: Cypress P1
        run: |
          echo "[E2E P1] Search, filters, profile, order history"
          echo "[E2E P1] Non-blocking by example policy; QA review required"
          echo "[E2E P1] >>> running: cypress run --spec cypress/e2e/p1"
          docker run --rm --network host -v "$PWD:/e2e" -w /e2e \
            -e CYPRESS_baseUrl=http://localhost:8080 \
            cypress/included:16.2.0 --spec "cypress/e2e/p1/**/*.cy.js"

  dast_zap:
    name: dast_zap (OWASP ZAP baseline)
    needs: [e2e_p1]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Start app (stand-in for staging)
        run: |
          docker load -i image.tar
          docker run -d --name app -p 8080:8080 "app:${GITHUB_SHA}"
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
      # Passive baseline scan only (no attacks) - safe for staging. Only scan targets you own.
      # Exit codes: 0 pass, 1 = FAIL-level alert (BLOCK), 2 = warnings (ignored by -I), 3 = error.
      # .zap/rules.tsv decides which rules are FAIL (block) / WARN / IGNORE.
      - name: ZAP baseline (BLOCK on FAIL rules)
        run: |
          echo "[DAST] OWASP ZAP baseline scan on authorized staging"
          echo "[DAST] BLOCK on policy-breaking security findings"
          echo "[DAST] >>> running: zap-baseline.py -t http://localhost:8080 -c rules.tsv -I"
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv -I \
            -r zap-report.html -J zap-report.json
      - name: Job summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          print("### OWASP ZAP baseline")
          try:
              alerts = [a for s in json.load(open("zap/zap-report.json"))["site"] for a in s["alerts"]]
          except Exception as e:
              alerts = []; print(f"no report ({e})")
          print("| Risk | Alert | Instances |\n|---|---|---|")
          for a in alerts:
              print(f"| {a['riskdesc']} | {a['name']} | {len(a.get('instances', []))} |")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.*

  # ───────────────────────── 18-20 production ─────────────────────────
  production_deploy:
    needs: [dast_zap, build_image]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Manual approval = Settings > Environments > production > Required reviewers
    environment: production
    env:
      IMAGE_REF: ${{ needs.build_image.outputs.image_ref }}
    outputs:
      image_ref: ${{ needs.build_image.outputs.image_ref }} # handed to production_smoke
    steps:
      - name: Simulated production deploy
        run: |
          echo "[PROD] Production environment approval granted (if configured)"
          echo "[PROD] Promote EXACT image $IMAGE_REF; no rebuild"
      # SAMPLE promotion (same digest that passed staging, E2E and DAST; commented - no cluster):
      # - run: |
      #     yq -i ".image.digest = \"${IMAGE_REF#*@}\"" gitops/charts/api/values-prod.yaml
      #     git -C gitops commit -am "prod: ${GITHUB_SHA::7}" && git -C gitops push
      #     argocd app wait api-prod --health --sync --timeout 600
      #     cosign verify "$IMAGE_REF" --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
      #       --certificate-oidc-issuer https://token.actions.githubusercontent.com   # only signed images

  # Smoke = a few fast, read-only checks right after the deploy. Demo: pull the EXACT promoted
  # digest from GHCR and check it (real life: the same curls against https://api.<prod-domain>).
  production_smoke:
    needs: [production_deploy]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.production_deploy.outputs.image_ref }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start promoted image (by digest)
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE_REF"
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz >/dev/null && break; sleep 1; done
      - name: Smoke checks
        run: |
          echo "[SMOKE] GET readiness, products, inventory"
          echo "[SMOKE] Test account auth and 401/403 authorization"
          echo "[SMOKE] Payment service health; no real charges"
          BASE=http://localhost:8080
          curl -fsS "$BASE/healthz"; echo
          curl -fsS "$BASE/products" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['apple']['stock'] >= 0; print('products OK:', list(d))"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/admin")
          test "$code" = 404 && echo "unknown route -> 404 OK"
          # SAMPLE with a real API (test account token from a secret; never a real payment):
          # code=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/api/orders")              # expect 401
          # code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SMOKE_TOKEN" \
          #   "$PROD_URL/api/admin")                                                          # expect 403
          # curl -fsS "$PROD_URL/api/payments/health"                                         # sandbox only

  production_monitor:
    needs: [production_smoke]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Simulated production monitor
        run: |
          echo "[MONITOR] Check 5xx error rate, p95 latency, availability"
          echo "[MONITOR] Alert and evaluate rollback if regression occurs"
      # SAMPLE post-deploy check against Prometheus (needs a reachable Prometheus, so commented):
      # - run: |
      #     sleep 600   # watch 10 minutes after the deploy
      #     q='sum(rate(http_requests_total{job="api",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="api"}[5m]))'
      #     ratio=$(curl -s "$PROM_URL/api/v1/query" --data-urlencode "query=$q" | jq -r '.data.result[0].value[1] // 0')
      #     echo "5xx ratio = $ratio"
      #     if awk "BEGIN{exit !($ratio > 0.05)}"; then
      #       echo "::error::5xx > 5% after deploy -> rollback"; argocd app rollback api-prod; exit 1
      #     fi

  # ───────────────────────── 21 nightly (schedule only) ─────────────────────────
  nightly_regression:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Nightly regression + Trivy rescan (new CVEs appear daily)
        run: |
          echo "[NIGHTLY] Run full P0 + P1 + P2 regression on isolated staging/test environment"
          echo "[NIGHTLY] >>> running: unit/integration tests + trivy image rescan"
          python3 -m unittest discover -s tests -t . -v
          docker build -q -t app:nightly .
          trivy image --severity "$GATE_SEVERITY" --ignore-unfixed --exit-code 1 --format table app:nightly
